name: PaperCurator Weekly Search

on:
  schedule:
    # 매주 월요일 10:00 UTC (한국시간 19:00)
    - cron: '0 10 * * 1'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  search-papers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install biopython requests urllib3
    
    - name: Create settings file
      run: |
        cat > notion_settings.json << EOF
        {
          "notion_token": "${{ secrets.NOTION_TOKEN }}",
          "papers_database_page_id": "${{ secrets.PAPERS_DATABASE_PAGE_ID }}",
          "papers_database_id": "${{ secrets.PAPERS_DATABASE_ID }}",
          "query_database_id": "${{ secrets.QUERY_DATABASE_ID }}",
          "gemini_api_key": "${{ secrets.GEMINI_API_KEY }}"
        }
        EOF
    
    - name: Run automation script
      id: search
      run: |
        python automation_script.py
        echo "paper_count=$(find . -name 'weekly_papers_*.json' -exec cat {} \; | grep -o '"pmid"' | wc -l)" >> $GITHUB_OUTPUT
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: weekly-papers
        path: weekly_papers_*.json
        retention-days: 30
    
    - name: Send email notification
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.EMAIL_ADDRESS }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: 📚 PaperCurator - 주간 논문 검색 완료
        to: ${{ secrets.EMAIL_ADDRESS }}
        from: PaperCurator <${{ secrets.EMAIL_ADDRESS }}>
        html_body: |
          <h2>📚 PaperCurator 주간 논문 검색 완료</h2>
          
          <p><strong>검색 일시:</strong> ${{ github.event.repository.updated_at }}</p>
          <p><strong>발견된 논문:</strong> ${{ steps.search.outputs.paper_count }}개</p>
          
          <hr>
          
          <h3>🔗 다음 단계</h3>
          <ol>
            <li><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">GitHub Actions에서 결과 다운로드</a></li>
            <li><a href="https://papercurator.streamlit.app">Streamlit에서 논문 선택</a> (배포 후 링크 업데이트 필요)</li>
            <li>선택 완료 후 자동으로 Gemini 요약 + Notion 업로드 시작</li>
          </ol>
          
          <hr>
          
          <p style="color: #666; font-size: 12px;">
            자동 생성된 이메일입니다. PaperCurator by Du-Hwa
          </p>
        attachments: weekly_papers_*.json
