name: PaperCurator Weekly Search

on:
  schedule:
    # 매주 월요일 10:00 UTC (한국시간 19:00)
    - cron: '0 10 * * 1'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  search-papers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install biopython requests urllib3
    
    - name: Create settings file
      run: |
        cat > notion_settings.json << EOF
        {
          "notion_token": "${{ secrets.NOTION_TOKEN }}",
          "papers_database_page_id": "${{ secrets.PAPERS_DATABASE_PAGE_ID }}",
          "papers_database_id": "${{ secrets.PAPERS_DATABASE_ID }}",
          "query_database_id": "${{ secrets.QUERY_DATABASE_ID }}",
          "gemini_api_key": "${{ secrets.GEMINI_API_KEY }}"
        }
        EOF
    
    - name: Run automation script
      id: search
      run: |
        python automation_script.py
        # 파일 이름을 고정된 이름으로 복사
        cp weekly_papers_*.json latest_papers.json
        echo "paper_count=$(cat latest_papers.json | grep -o '"pmid"' | wc -l)" >> $GITHUB_OUTPUT
    
    - name: Commit and push results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add latest_papers.json
        git commit -m "🤖 Weekly paper search - $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
        git push
    
    - name: Upload results (backup)
      uses: actions/upload-artifact@v4
      with:
        name: weekly-papers
        path: weekly_papers_*.json
        retention-days: 30
    
    - name: Send email notification
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.EMAIL_ADDRESS }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: 📚 PaperCurator - 주간 논문 검색 완료
        to: ${{ secrets.EMAIL_ADDRESS }}
        from: PaperCurator <${{ secrets.EMAIL_ADDRESS }}>
        html_body: |
          <h2>📚 PaperCurator 주간 논문 검색 완료</h2>
          
          <p><strong>검색 일시:</strong> $(date +'%Y-%m-%d %H:%M') KST</p>
          <p><strong>발견된 논문:</strong> ${{ steps.search.outputs.paper_count }}개</p>
          
          <hr>
          
          <h3>🔗 다음 단계</h3>
          <p><strong>Streamlit에서 논문 선택하기:</strong></p>
          <a href="https://papercurator-fmbftyrkz4qc6dthnyh2em.streamlit.app" style="display: inline-block; padding: 10px 20px; background-color: #FF4B4B; color: white; text-decoration: none; border-radius: 5px;">
            📚 논문 선택하러 가기
          </a>
          
          <p style="margin-top: 20px;">
            ✅ 최신 검색 결과가 자동으로 표시됩니다<br>
            ✅ 수동 다운로드 불필요
          </p>
          
          <hr>
          
          <h3>📋 참고</h3>
          <ul>
            <li><a href="https://github.com/${{ github.repository }}/blob/main/latest_papers.json">GitHub에서 결과 보기</a></li>
            <li><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">실행 로그 확인</a></li>
          </ul>
          
          <hr>
          
          <p style="color: #666; font-size: 12px;">
            자동 생성된 이메일입니다. PaperCurator by Du-Hwa
          </p>
